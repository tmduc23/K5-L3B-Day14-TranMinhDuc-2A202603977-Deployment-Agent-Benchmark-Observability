# ============================================================
# Agent + Redis bằng một lệnh `docker compose up` (tiêu chí 2)
#
#   agent : build từ Dockerfile, REDIS_URL trỏ tới service redis
#   redis : redis:7-alpine, có healthcheck
#
# agent chỉ khởi động sau khi redis báo healthy, tránh cảnh agent lên trước
# rồi phải chờ kết nối (bài học depends_on + condition ở Part 2).
# Không khai `version:` — thuộc tính này đã bỏ, Compose sẽ cảnh báo nếu có.
# ============================================================
services:
  agent:
    build: .
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - ENVIRONMENT=staging
      # Tên service `redis` chính là hostname trong network của Compose
      - REDIS_URL=redis://redis:6379/0
      - RATE_LIMIT_PER_MINUTE=10
      - DAILY_BUDGET_USD=1.0
      - MONTHLY_BUDGET_USD=10.0
      # AGENT_API_KEY KHÔNG đặt ở đây — secret đọc từ .env (trong .gitignore)
    env_file:
      - path: .env
        required: false      # không có .env vẫn chạy được
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  redis_data:
