# ============================================================
# render.yaml — Render Blueprint (tiêu chí 12, phương án thay railway.toml)
#
# Khác bản mẫu trong 03-cloud-deployment/render/: ở đây dùng
# runtime: docker để Render build bằng chính Dockerfile multi-stage của
# Part 6, thay vì buildCommand/startCommand kiểu Python buildpack.
# Nhờ vậy thứ chạy trên Render đúng bằng thứ đã test bằng docker compose.
#
# Deploy: Render Dashboard → New → Blueprint → chọn repo này
# ============================================================

services:
  # ──────────────────────────────────────
  # Web service — AI Agent
  # ──────────────────────────────────────
  - type: web
    name: k5-day14-agent
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: singapore
    plan: free
    autoDeploy: true

    # Render gọi path này; non-200 → đánh dấu deploy thất bại
    healthCheckPath: /health

    envVars:
      - key: ENVIRONMENT
        value: production
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: DAILY_BUDGET_USD
        value: "1.0"
      - key: MONTHLY_BUDGET_USD
        value: "10.0"

      # Secret: Render tự sinh giá trị ngẫu nhiên, KHÔNG ghi vào file này
      - key: AGENT_API_KEY
        generateValue: true

      # REDIS_URL lấy tự động từ service redis bên dưới — không hardcode
      - key: REDIS_URL
        fromService:
          type: redis
          name: k5-day14-redis
          property: connectionString

    # PORT: Render tự inject, CMD trong Dockerfile dùng ${PORT:-8000}
    # nên không cần khai ở đây.

  # ──────────────────────────────────────
  # Redis — state của rate limiter và cost guard
  # ──────────────────────────────────────
  - type: redis
    name: k5-day14-redis
    region: singapore
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []        # rỗng = chỉ cho phép truy cập nội bộ trong Render
